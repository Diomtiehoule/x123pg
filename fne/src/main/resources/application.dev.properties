spring.application.name=fne

# Render met automatiquement un port dynamique, donc on NE fixe pas 8084 en prod
server.port=8084

# Database configuration (Render Environment Variables)
spring.profiles.active=dev
spring.datasource.url=jdbc:postgresql://localhost:5432/fne
spring.datasource.username=postgres
spring.datasource.password=123456


spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

jwt.app.expiration=60000000





